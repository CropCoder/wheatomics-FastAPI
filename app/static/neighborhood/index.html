<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gene Neighborhood Synteny Viewer — view the flanking genes (±5) of a wheat gene across genomes with homoeologous cluster connections.">
<title>Gene Neighborhood | WheatOmics 2.0</title>
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="/css/bootstrap-4.5.3-dist/css/bootstrap.css">
<link rel="stylesheet" href="/api/v2shell/shell.css">
<style>
  .tool-shell { max-width: 1180px; }
  .search-box { display: flex; flex-wrap: wrap; gap: 10px; max-width: 680px; margin: 0 auto; }
  .search-box input { flex: 1 1 320px; }
  .search-box button { flex: 0 0 auto; }
  #message { max-width: 680px; margin: 14px auto 0; color: #9b3c2f; font-weight: 700; text-align: center; font-size: 13px; }
  #message:empty { display: none; }
  #result { display: none; }
  .summary-card { margin-top: 6px; padding: 18px 20px; background: var(--mist); border-left: 5px solid var(--leaf); border-radius: 0 12px 12px 0; }
  .summary-card .label { color: var(--muted); font-family: var(--utility); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  .query-title { font-size: 18px; font-weight: 750; color: var(--forest-deep); font-family: var(--display); }
  .cluster-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 11px; margin-left: 10px; vertical-align: middle; }
  .cluster-badge-1 { background: #e3f2fd; color: #1565c0; }
  .cluster-badge-2 { background: #fce4ec; color: #c62828; }
  .cluster-badge-3 { background: #e8f5e9; color: #2e7d32; }
  .cluster-badge-4 { background: #fff3e0; color: #e65100; }
  .cluster-badge-5 { background: #f3e5f5; color: #7b1fa2; }
  .cluster-badge-6 { background: #e0f7fa; color: #00695c; }
  .cluster-badge-7 { background: #fbe9e7; color: #4e342e; }
  .cluster-badge-none { background: var(--mist); color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 18px 0; padding: 10px 14px; background: #fbfdfb; border: 1px solid var(--line); border-radius: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4d6559; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .gene-table { margin-top: 4px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .gene-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .gene-table th { background: var(--mist); color: #4d6559; font-family: var(--utility); font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .gene-table td { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .gene-table tbody tr:last-child td { border-bottom: 0; }
  .gene-table tr.query-row { background: #fdf6e3; font-weight: 700; }
  .gene-table tr.query-row td:first-child::before { content: "★ "; color: var(--wheat); }
  .gene-table tr:hover { background: #f1f8f2; }
</style>
</head>
<body>
<div id="v2-shell-header"></div>

<main id="main-content">
  <section class="news-hero">
    <div class="container news-hero-inner">
      <div>
        <p class="news-kicker">WheatOmics 2.0 · Synteny tool</p>
        <h1 class="news-title">Gene <em>Neighborhood</em></h1>
        <p class="news-lead">Search a gene ID to view its chromosomal neighbors (±5 genes) across all genomes, with homoeologous cluster connections highlighted.</p>
        <div class="news-stats">
          <span class="news-stat"><strong>±5</strong> flanking genes</span>
          <span class="news-stat"><strong>7</strong> homoeologous groups</span>
          <span class="news-stat">Multi-genome view</span>
        </div>
      </div>
      <div class="news-hero-mark" aria-hidden="true"><svg class="icon"><use href="#i-nodes"/></svg></div>
    </div>
  </section>

  <section class="news-body">
    <div class="container tool-shell">
      <div class="card">
        <div class="card-body">
          <form id="searchForm" class="search-box">
            <input id="geneInput" name="q" class="form-control" placeholder="Example: TraesCS1A02G219700.1" aria-label="Gene ID">
            <button type="submit" class="btn btn-primary">Search</button>
          </form>
          <div id="message"></div>
        </div>
      </div>

      <div id="result">
        <div class="summary-card">
          <div class="label">Query Gene</div>
          <div class="query-title" id="queryTitle"></div>
          <div id="clusterInfo" style="margin-top:6px;"></div>
        </div>
        <div class="legend" id="legend"></div>
        <h3 class="v2-section-title" style="margin-top:22px;">Neighborhood Genes on <span id="chromLabel"></span></h3>
        <div class="gene-table" id="geneTable"></div>
      </div>
    </div>
  </section>
</main>

<div id="v2-shell-footer"></div>

<script src="/api/v2shell/shell.js"></script>
<script src="app.js"></script>
</body>
</html>
